name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          # The oldest supported runner, so the AppImage and .deb link against an older
          # glibc and run on more distros.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/baseus-app/pnpm-lock.yaml'

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/baseus-app

      # Both jobs publish to the same release; tauri-action merges each platform into
      # latest.json. The Linux entry goes unused: Linux builds have no updater plugin.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/baseus-app
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: 'baseus-desktop ${{ github.ref_name }}'
          releaseBody: |
            Desktop companion for Baseus Bass BP1 Pro ANC and BP1 Ultra earbuds.

            **Windows** (10 1903 or later): download `baseus-app_*_x64-setup.exe`. Installed
            copies update themselves.
            **Linux** (BlueZ): `baseus-app_*_amd64.deb` for Debian/Ubuntu, or the
            `.AppImage` for anything else. These don't auto-update.

            See CHANGELOG.md for what's new.
          releaseDraft: false
          prerelease: false
