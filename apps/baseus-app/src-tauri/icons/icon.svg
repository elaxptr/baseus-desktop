<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- A thin gap between the ear tip and the body -->
    <mask id="tip-gap">
      <rect x="-200" y="-200" width="1400" height="1400" fill="#fff"/>
      <rect x="338" y="236" width="124" height="120" rx="52" fill="#000" stroke="#000" stroke-width="56"/>
    </mask>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <!-- Earbud, tilted with its tip toward the sound waves -->
  <g fill="#fff" transform="rotate(30 400 480)">
    <g mask="url(#tip-gap)">
      <circle cx="400" cy="480" r="170"/>
      <rect x="332" y="480" width="136" height="350" rx="68"/>
    </g>
    <rect x="338" y="236" width="124" height="120" rx="52"/>
  </g>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="58">
    <path d="M690 318a210 210 0 0 1 0 210"/>
    <path d="M790 248a330 330 0 0 1 0 350" opacity=".55"/>
  </g>
</svg>
